name: gimnasio_facial
description: App FitAccess para reconocimiento y asistencia en gimnasios.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0
  http: ^1.6.0
  # Camera2 permite recibir fotogramas NV21 para ML Kit en Android.
  camera_android: 0.10.12
  google_mlkit_face_detection: 0.13.2
  google_mlkit_commons: 0.11.1
  audioplayers: 6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/fitaccess_icono.png
    - assets/images/fitaccess_logo_completo.png
    - assets/audio/tap.mp3
    - assets/audio/success.mp3
    - assets/audio/notice.mp3
